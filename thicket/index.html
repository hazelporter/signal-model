<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thicket — Capture</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <strong>Thicket</strong> <span class="pill">Capture</span>
      </div>
      <div class="controls">
        <label>Pressure</label>
        <input id="pressure" type="range" min="0" max="100" value="70" />
        <span id="pval" class="pill">70</span>
        <a class="link" href="../">Home</a>
      </div>
    </div>

    <section class="model stack">
      <div class="band">MAP <small>meaning / language</small></div>
      <div class="stage">
        <div class="label map">MAP</div>
        <div class="label terrain">TERRAIN</div>

        <div class="channel" id="channel">
          <div class="particle" id="dot"></div>
        </div>
      </div>
      <div class="note">
        Thicket = entanglement near terrain. Signal loops low; map receives fragments or pressure, not full translation.
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
